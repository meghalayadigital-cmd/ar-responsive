<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Album Dynamic AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 1. స్క్రీన్ మీద కనిపించే కస్టమ్ ప్లే బటన్ */
    .ar-play-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      display: none; /* మొదట దాచి ఉంచుతాం, టార్గెట్ దొరకగానే వస్తుంది */
      box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }

    /* 2. వీడియోని ఫుల్ స్క్రీన్ (Stuck) చేయడానికి CSS క్లాస్ */
    .stuck-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important; /* వీడియో రేషియో పాడవకుండా ఉంటుంది */
      background: black;
      z-index: 1000 !important;
    }

    /* 3. ఫుల్ స్క్రీన్ లో ఉన్నప్పుడు బ్యాక్ వెళ్ళడానికి బటన్ */
    .back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 1001;
      display: none;
    }
  </style>
</head>

<body>

  <button id="mainPlayBtn" class="ar-play-btn">Click to Play Fullscreen</button>
  <button id="backToARBtn" class="back-btn">Back to AR</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <video id="appleVideo" src="./videos/Apple.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0" id="targetApple">
      <a-plane id="applePlane" src="#appleVideo" position="0 0 0" rotation="0 0 0"></a-plane>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const appleVideo = document.querySelector("#appleVideo");
    const applePlane = document.querySelector("#applePlane");
    const targetApple = document.querySelector("#targetApple");
    
    const mainPlayBtn = document.querySelector("#mainPlayBtn");
    const backToARBtn = document.querySelector("#backToARBtn");

    let isFullscreen = false;

    // వీడియో సైజ్ ని బట్టి AR ప్లేన్ సైజ్ అడ్జస్ట్ చేయడం (Responsive)
    video.addEventListener("loadedmetadata", () => {
      const ratio = appleVideo.videoHeight / appleVideo.videoWidth;
      applePlane.setAttribute("width", 1);
      applePlane.setAttribute("height", ratio);
    });

    // 🎯 1. టార్గెట్ దొరికినప్పుడు (Target Found)
    targetApple.addEventListener("targetFound", () => {
      if (!isFullscreen) {
        appleVideo.play();
        mainPlayBtn.style.display = "block"; // స్క్రీన్ పై బటన్ చూపిస్తాం
      }
    });

    // 🎯 2. టార్గెట్ పోయినప్పుడు (Target Lost)
    targetApple.addEventListener("targetLost", () => {
      // ఒకవేళ యూజర్ ఫుల్ స్క్రీన్ మోడ్ లో లేకపోతేనే వీడియో ఆపాలి
      if (!isFullscreen) {
        appleVideo.pause();
        mainPlayBtn.style.display = "none";
      }
    });

    // 🎯 3. ఫుల్ స్క్రీన్ (Responsive to Stuck) మ్యాజిక్ బటన్
    mainPlayBtn.addEventListener("click", () => {
      isFullscreen = true;
      
      // వీడియో ని AR ప్లేన్ నుండి విడదీసి డైరెక్ట్ స్క్రీన్ కి స్ట్రక్ (Fullscreen) చేస్తాం
      appleVideo.classList.add("stuck-fullscreen");
      appleVideo.controls = true; // ఫుల్ స్క్రీన్ లో ప్లే/పాజ్ కంట్రోల్స్ ఇస్తాం
      
      // బటన్ల డిస్ప్లే మారుస్తాం
      mainPlayBtn.style.display = "none";
      backToARBtn.style.display = "block";
    });

    // 🎯 4. ఫుల్ స్క్రీన్ నుండి మళ్ళీ AR మోడ్ కి రావడం
    backToARBtn.addEventListener("click", () => {
      isFullscreen = false;
      
      // ఫుల్ స్క్రీన్ క్లాస్ మరియు కంట్రోల్స్ తీసేస్తాం (తిరిగి AR లో రెస్పాన్సివ్ అవుతుంది)
      appleVideo.classList.remove("stuck-fullscreen");
      appleVideo.controls = false;
      
      backToARBtn.style.display = "none";
      
      // ఒకవేళ కెమెరా ఇంకా టార్గెట్ ముందే ఉంటే బటన్ చూపిస్తాం, లేదంటే వీడియో పాజ్ చేస్తాం
      // Mind-AR టార్గెట్ స్టేటస్ చెక్
      if (targetApple.object3D.visible) {
        mainPlayBtn.style.display = "block";
        appleVideo.play();
      } else {
        appleVideo.pause();
      }
    });
  </script>

</body>
</html>
