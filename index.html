<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Album Dynamic AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 1. స్క్రీన్ మీద కనిపించే కాలింగ్ బటన్ */
    .ar-play-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      display: none; /* మొదట దాచి ఉంచుతాం */
      box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
    }

    /* 2. ఫుల్ స్క్రీన్ (Stuck) వీడియో కంటైనర్ */
    #fullscreen-holder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 9999; /* అన్నిటికన్నా పైన ఉంటుంది */
      display: none; /* బటన్ నొక్కినప్పుడే ఓపెన్ అవుతుంది */
      justify-content: center;
      align-items: center;
    }

    #fullscreen-holder video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* వీడియో రేషియో కరెక్ట్ గా ఉంటుంది */
    }

    /* 3. బ్యాక్ బటన్ స్టైల్ */
    .back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      z-index: 10000;
    }
  </style>
</head>

<body>

  <!-- AR రెస్పాన్సివ్ మోడ్ లో వచ్చే బటన్ -->
  <button id="mainPlayBtn" class="ar-play-btn">Click to Play Fullscreen</button>

  <!-- ఫుల్ స్క్రీన్ (Stuck Mode) లేఅవుట్ -->
  <div id="fullscreen-holder">
    <button id="backToARBtn" class="back-btn">Back to AR</button>
    <video id="stuckVideo" controls playsinline></video>
  </div>

  <!-- AR సీన్ -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <video id="appleVideo" src="./videos/Apple.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <!-- AR టార్గెట్ (Responsive) -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetApple">
      <a-plane id="applePlane" src="#appleVideo" position="0 0 0" rotation="0 0 0"></a-plane>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const arScene = document.querySelector("#arScene");
    const appleVideo = document.querySelector("#appleVideo");
    const applePlane = document.querySelector("#applePlane");
    const targetApple = document.querySelector("#targetApple");
    
    const mainPlayBtn = document.querySelector("#mainPlayBtn");
    const fullscreenHolder = document.querySelector("#fullscreen-holder");
    const stuckVideo = document.querySelector("#stuckVideo");
    const backToARBtn = document.querySelector("#backToARBtn");

    let isFullscreenMode = false;

    // వీడియో లోడ్ అవ్వగానే ప్లేన్ రేషియో సెట్ చేయడం
    appleVideo.addEventListener("loadedmetadata", () => {
      const ratio = appleVideo.videoHeight / appleVideo.videoWidth;
      applePlane.setAttribute("width", 1);
      applePlane.setAttribute("height", ratio);
    });

    // 🎯 1. స్కానర్ టార్గెట్ దొరికినప్పుడు (Responsive Mode)
    targetApple.addEventListener("targetFound", () => {
      if (!isFullscreenMode) {
        appleVideo.play().catch(err => console.log("Autoplay blocked:", err));
        mainPlayBtn.style.display = "block";
      }
    });

    // 🎯 2. టార్గెట్ కోల్పోయినప్పుడు
    targetApple.addEventListener("targetLost", () => {
      if (!isFullscreenMode) {
        appleVideo.pause();
        mainPlayBtn.style.display = "none";
      }
    });

    // 🎯 3. బటన్ క్లిక్ చేయగానే - Responsive నుండి Full Screen (Stuck) మోడ్‌కి మార్చడం
    mainPlayBtn.addEventListener("click", () => {
      isFullscreenMode = true;
      
      // AR వీడియో ఎక్కడైతే ఆగిందో ఆ టైమ్ నోట్ చేసుకుంటాం
      const currentProgress = appleVideo.currentTime;
      appleVideo.pause(); // AR వీడియోని ఆపేస్తాం
      mainPlayBtn.style.display = "none";

      // ఫుల్ స్క్రీన్ ప్లేయర్ లోకి అదే వీడియో సోర్స్ ని పంపిస్తాం
      stuckVideo.src = appleVideo.src;
      stuckVideo.currentTime = currentProgress;
      
      // HTML హోల్డర్ ని ఓపెన్ చేసి ప్లే చేస్తాం (ఇది అస్సలు స్ట్రక్ అవ్వదు)
      fullscreenHolder.style.display = "flex";
      stuckVideo.play();
    });

    // 🎯 4. ఫుల్ స్క్రీన్ నుండి తిరిగి AR కి రావడం
    backToARBtn.addEventListener("click", () => {
      isFullscreenMode = false;
      
      const currentProgress = stuckVideo.currentTime;
      stuckVideo.pause();
      stuckVideo.src = ""; // క్లియర్ వీడియో సోర్స్
      fullscreenHolder.style.display = "none";

      // ఒకవేళ మొబైల్ కెమెరా ఇంకా ఇమేజ్ టార్గెట్ ముందే ఉంటే
      if (targetApple.object3D.visible) {
        appleVideo.currentTime = currentProgress;
        appleVideo.play();
        mainPlayBtn.style.display = "block";
      } else {
        appleVideo.pause();
      }
    });
  </script>

</body>
</html>
