<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Album Dynamic AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* custom play button style */
    .ar-play-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      display: none; /* మొదట దాచి ఉంచుతాం */
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }

    /* Video Full Screen/Stuck container */
    #fullscreen-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #fullscreen-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    #fullscreen-video {
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      color: black;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <button id="mainPlayBtn" class="ar-play-btn">Click to Play Fullscreen</button>

  <div id="fullscreen-container">
    <button class="close-btn" id="closeBtn">Back to AR</button>
    <video id="fullscreen-video" controls playsinline></video>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <video id="appleVideo" src="./videos/Apple.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="girlVideo" src="./videos/Girl.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0" id="targetApple">
      <a-plane id="applePlane" src="#appleVideo" position="0 0 0" rotation="0 0 0"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" id="targetGirl">
      <a-plane id="girlPlane" src="#girlVideo" position="0 0 0" rotation="0 0 0"></a-plane>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const appleVideo = document.querySelector("#appleVideo");
    const girlVideo = document.querySelector("#girlVideo");

    const applePlane = document.querySelector("#applePlane");
    const girlPlane = document.querySelector("#girlPlane");

    const targetApple = document.querySelector("#targetApple");
    const targetGirl = document.querySelector("#targetGirl");

    // Fullscreen UI Elements
    const mainPlayBtn = document.querySelector("#mainPlayBtn");
    const fullscreenContainer = document.querySelector("#fullscreen-container");
    const fullscreenVideo = document.querySelector("#fullscreen-video");
    const closeBtn = document.querySelector("#closeBtn");

    let activeVideo = null; // ప్రస్తుతం ఏ వీడియో టార్గెట్ లో ఉందో ట్రాక్ చేయడానికి

    // Adjust plane ratio
    function adjustPlane(video, plane) {
      video.addEventListener("loadedmetadata", () => {
        const ratio = video.videoHeight / video.videoWidth;
        plane.setAttribute("width", 1);
        plane.setAttribute("height", ratio);
      });
    }

    adjustPlane(appleVideo, applePlane);
    adjustPlane(girlVideo, girlPlane);

    // Apple Target Events
    targetApple.addEventListener("targetFound", () => {
      activeVideo = appleVideo;
      activeVideo.play();
      mainPlayBtn.style.display = "block"; // బటన్ చూపిస్తాం
    });

    targetApple.addEventListener("targetLost", () => {
      if (activeVideo === appleVideo) {
        appleVideo.pause();
        mainPlayBtn.style.display = "none";
        activeVideo = null;
      }
    });

    // Girl Target Events
    targetGirl.addEventListener("targetFound", () => {
      activeVideo = girlVideo;
      activeVideo.play();
      mainPlayBtn.style.display = "block"; // బటన్ చూపిస్తాం
    });

    targetGirl.addEventListener("targetLost", () => {
      if (activeVideo === girlVideo) {
        girlVideo.pause();
        mainPlayBtn.style.display = "none";
        activeVideo = null;
      }
    });

    // 🔥 Play Button క్లిక్ చేసినప్పుడు జరిగే మ్యాజిక్
    mainPlayBtn.addEventListener("click", () => {
      if (activeVideo) {
        // 1. AR లో రన్ అవుతున్న వీడియో ప్రస్తుత టైమ్ సేవ్ చేసుకుని పాజ్ చేస్తాం
        const currentTime = activeVideo.currentTime;
        activeVideo.pause();

        // 2. Fullscreen HTML Video కి AR వీడియో లింక్ ఇస్తాం
        fullscreenVideo.src = activeVideo.src;
        fullscreenVideo.currentTime = currentTime;
        
        // 3. UI ని స్క్రీన్ పై Stuck (Full screen Overlay) చేస్తాం
        fullscreenContainer.classList.add("active");
        fullscreenVideo.play();
        
        // AR ప్లే బటన్ దాచేస్తాం
        mainPlayBtn.style.display = "none";
      }
    });

    // Close Button క్లిక్ చేస్తే మళ్ళీ AR మోడ్ కి వెళ్తుంది
    closeBtn.addEventListener("click", () => {
      fullscreenVideo.pause();
      fullscreenContainer.classList.remove("active");
      fullscreenVideo.src = ""; // Clear src
      
      // ఒకవేళ యూజర్ ఇంకా టార్గెట్ ముందే ఉంటే మళ్ళీ AR లో ప్లే అవ్వడానికి
      if(activeVideo) {
        activeVideo.play();
        mainPlayBtn.style.display = "block";
      }
    });
  </script>

</body>
</html>
